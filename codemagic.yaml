workflows:
  android-workflow:
    name: TikTok Android App
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Setup and Build Master APK
        script: |
          mkdir -p lib
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          flutter create --platforms=android --org=com.yared.tiktak .

          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          flutter pub add shared_preferences image_picker video_player http cupertino_icons

          python3 -c "
          import glob
          for path in glob.glob('android/app/build.gradle*'):
              with open(path, 'r') as f:
                  lines = f.readlines()
              with open(path, 'w') as f:
                  for line in lines:
                      if 'minSdk' in line:
                          f.write('        minSdk = 21\n')
                      else:
                          f.write(line)
          "

          echo "flutter.minSdkVersion=21" >> android/local.properties

          flutter build apk --debug --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
