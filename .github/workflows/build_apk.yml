name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Build Android APK
        run: |
          flutter create --org com.yared.tiktak tiktak_app
          cd tiktak_app
          flutter pub add video_player http cupertino_icons
          cp ../main.dart lib/main.dart
          flutter build apk --debug
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-debug.apk ../build_output/tiktak-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktak-android-apk
          path: build_output/tiktak-app.apk
