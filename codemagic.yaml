workflows:
  android-workflow:
    name: TikTok Android App
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Setup project structure and build APK
        script: |
          # 1. lib ፎልደር ማዘጋጀት
          mkdir -p lib
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          # 2. የ Android ፋይሎችን መፍጠር
          flutter create --platforms=android --org=com.yared.tiktak .

          # 3. የእኛን main.dart ወደ lib መመለስ
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          # 4. ለ video_player የሚያስፈልገውን minSdkVersion 21 ማስተካከል
          python3 -c '
          import glob
          for g in glob.glob("android/app/build.gradle*"):
              with open(g, "r") as f:
                  c = f.read()
              c = c.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              c = c.replace("minSdk = flutter.minSdk", "minSdk = 21")
              with open(g, "w") as f:
                  f.write(c)
          '

          # 5. ጥቅሎችን ማውረድ
          flutter pub get

          # 6. APK መገንባት
          flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk
