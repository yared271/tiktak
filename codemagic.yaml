workflows:
  android-workflow:
    name: TikTok Android App
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Setup and Build Master APK
        script: |
          mkdir -p lib
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          flutter create --platforms=android --org=com.yared.tiktak .

          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          flutter pub add shared_preferences image_picker video_player http cupertino_icons
          flutter build apk --debug --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
