name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: |
          # 1. Android ፈቃዶችን (Licenses) ማጽደቅ
          yes | flutter doctor --android-licenses || true
          
          # 2. አዲስ የ Flutter መተግበሪያ መፍጠር
          flutter create --org com.yared.tiktak --platforms android tiktak_app
          cd tiktak_app

          # 3. አስፈላጊ ጥቅሎችን መጨመር
          flutter pub add video_player http cupertino_icons

          # 4. የእኛን main.dart ኮድ መተካት
          rm -f lib/main.dart
          cp ../main.dart lib/main.dart

          # 5. APK በንጽህና መገንባት
          flutter build apk --debug --no-tree-shake-icons

          # 6. የወጣውን APK ፋይል ማዘጋጀት
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-debug.apk ../build_output/tiktak-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktak-android-apk
          path: build_output/tiktak-app.apk
