workflows:
  android-workflow:
    name: TikTok Android App
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android project structure
        script: |
          flutter create --platforms=android .
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
