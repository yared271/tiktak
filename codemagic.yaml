workflows:
  android-workflow:
    name: TikTok Android App
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Setup project and build Master APK
        script: |
          mkdir -p lib
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          flutter create --platforms=android --org=com.yared.tiktak .

          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

          # 1. minSdkVersion 21 ማስተካከል
          python3 -c '
          import glob
          for g in glob.glob("android/app/build.gradle*"):
              with open(g, "r") as f:
                  c = f.read()
              c = c.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              c = c.replace("minSdk = flutter.minSdk", "minSdk = 21")
              with open(g, "w") as f:
                  f.write(c)
          '

          # 2. የካሜራ እና ድምጽ ፍቃዶች መጨመር
          python3 -c '
          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              m = f.read()
          perms = "<uses-permission android:name=\"android.permission.INTERNET\"/>\n<uses-permission android:name=\"android.permission.CAMERA\"/>\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n"
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "<application")
          with open(manifest, "w") as f:
              f.write(m)
          '

          flutter pub add image_picker video_player http cupertino_icons
          flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk
