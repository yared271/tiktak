name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Setup Flutter App and Build APK
        run: |
          flutter create tiktak_app --platforms=android --org=com.yared.tiktak
          cd tiktak_app
          flutter pub add video_player http cupertino_icons
          cp ../main.dart lib/main.dart
          flutter build apk --release
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktak-release-apk
          path: build_output/app-release.apk
